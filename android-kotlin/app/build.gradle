plugins {
  id 'com.android.application'
  id 'org.jetbrains.kotlin.android'
}

// Servidor do Kesh TV (troque com -PstartUrl=...). O app conversa com a API dele.
def serverUrl = project.findProperty('startUrl') ?: 'https://central-apps-hub.com.br/kesh-tv/'
def appVersionCode = (project.findProperty('versionCode') ?: '1') as int
def appVersionName = project.findProperty('versionName') ?: '1.0.0'

android {
  namespace 'br.com.centralappshub.keshtv.kotlin'
  compileSdk 34
  defaultConfig {
    applicationId 'br.com.centralappshub.keshtv.kotlin'
    minSdk 23
    targetSdk 34
    versionCode appVersionCode
    versionName appVersionName
    buildConfigField 'String', 'SERVER_URL', "\"${serverUrl}\""
  }
  buildFeatures { compose true; buildConfig true }
  composeOptions { kotlinCompilerExtensionVersion '1.5.8' }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
  kotlinOptions { jvmTarget = '17' }
  packaging { resources { excludes += '/META-INF/{AL2.0,LGPL2.1}' } }

  // Mesma chave do app WebView (variáveis KESH_*); sem ela, chave de depuração.
  def ks = System.getenv('KESH_KEYSTORE')
  signingConfigs {
    if (ks) {
      release {
        storeFile file(ks)
        storePassword System.getenv('KESH_KEYSTORE_PASSWORD')
        keyAlias System.getenv('KESH_KEY_ALIAS') ?: 'kesh-tv'
        keyPassword System.getenv('KESH_KEY_PASSWORD') ?: System.getenv('KESH_KEYSTORE_PASSWORD')
      }
    }
  }
  buildTypes {
    release {
      minifyEnabled false
      signingConfig ks ? signingConfigs.release : signingConfigs.debug
    }
  }
}

dependencies {
  implementation platform('androidx.compose:compose-bom:2024.02.00')
  implementation 'androidx.compose.ui:ui'
  implementation 'androidx.compose.material3:material3'
  implementation 'androidx.compose.material:material-icons-extended'
  implementation 'androidx.activity:activity-compose:1.8.2'
  implementation 'androidx.navigation:navigation-compose:2.7.7'
  implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
  implementation 'androidx.media3:media3-exoplayer:1.3.0'
  implementation 'androidx.media3:media3-exoplayer-hls:1.3.0'
  implementation 'androidx.media3:media3-ui:1.3.0'
  implementation 'io.coil-kt:coil-compose:2.6.0'
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}

dependencies {
  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.json:json:20231013'
}
