plugins { id 'com.android.application' }

// Endereço do Kesh TV publicado (troque com -PstartUrl=... para outro servidor).
def startUrl = project.findProperty('startUrl') ?: 'https://central-apps-hub.com.br/kesh-tv/'
def appVersionCode = (project.findProperty('versionCode') ?: '1') as int
def appVersionName = project.findProperty('versionName') ?: '1.0.0'

android {
  namespace 'br.com.centralappshub.keshtv'
  compileSdk 34
  defaultConfig {
    applicationId 'br.com.centralappshub.keshtv'
    minSdk 22
    targetSdk 34
    versionCode appVersionCode
    versionName appVersionName
    buildConfigField 'String', 'START_URL', "\"${startUrl}\""
  }
  buildFeatures { buildConfig true }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  // Assinatura do APK final: chave por variáveis de ambiente (nunca no repositório).
  // Sem KESH_KEYSTORE o release sai assinado com a chave de depuração (serve para testes).
  def ks = System.getenv('KESH_KEYSTORE')
  signingConfigs {
    if (ks) {
      release {
        storeFile file(ks)
        storePassword System.getenv('KESH_KEYSTORE_PASSWORD')
        keyAlias System.getenv('KESH_KEY_ALIAS') ?: 'kesh-tv'
        keyPassword System.getenv('KESH_KEY_PASSWORD') ?: System.getenv('KESH_KEYSTORE_PASSWORD')
      }
    }
  }
  buildTypes {
    release {
      minifyEnabled false
      signingConfig ks ? signingConfigs.release : signingConfigs.debug
    }
  }
}
