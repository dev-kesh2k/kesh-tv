name: Problema
description: Algo não funciona como deveria
labels: [bug]
body:
  - type: textarea
    id: o-que
    attributes:
      label: O que aconteceu
      description: E o que você esperava que acontecesse.
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Como reproduzir
      placeholder: "1. Abra…\n2. Toque em…\n3. Veja o erro"
    validations:
      required: true
  - type: dropdown
    id: tipo
    attributes:
      label: Onde
      options: [Importação de lista, Ao vivo, Filmes, Séries, Player / conversão, Layout, Outro]
  - type: input
    id: aparelho
    attributes:
      label: Aparelho e navegador
      placeholder: "iPhone 13 / Safari, Windows / Chrome…"
  - type: markdown
    attributes:
      value: "⚠️ Não cole links de listas, usuários ou senhas do seu provedor IPTV."
