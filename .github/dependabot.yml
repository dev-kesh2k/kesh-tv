version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    # Versões principais (ex.: Prisma 7, Vite 8) quebram compatibilidade: migração feita à mão.
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
    groups:
      backend-minor:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    # Versões principais (ex.: Prisma 7, Vite 8) quebram compatibilidade: migração feita à mão.
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
    groups:
      frontend-minor:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
